version: '3.8'

networks:
  arya-banking-net:
    external: true

services:

  service-registry:
    image: karthikulkarni/arya-banking-service-registry:latest
    container_name: service-registry
    ports:
      - "8761:8761"
    restart: unless-stopped
    networks:
      - arya-banking-net

  config-server:
    image: karthikulkarni/arya-banking-config-server:latest
    container_name: config-server
    ports:
      - "8090:8090"
    environment:
      SPRING_PROFILES_ACTIVE: default
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka/
    depends_on:
      - service-registry
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - arya-banking-net

  api-gateway:
    image: karthikulkarni/arya-banking-api-gateway:latest
    container_name: api-gateway
    ports:
      - "8085:8085"
    environment:
      SPRING_PROFILES_ACTIVE: default
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka/
      SPRING_CLOUD_CONFIG_URI: http://config-server:8090
    depends_on:
      service-registry:
        condition: service_started
      config-server:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - arya-banking-net
